databases:
  - name: taskflow-db
    plan: free

services:
  - type: web
    name: taskflow
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      # Free tier has no persistent disk, so SQLite would be wiped on every
      # deploy. Postgres holds the data instead.
      - key: DATABASE_URL
        fromDatabase:
          name: taskflow-db
          property: connectionString
      # Generated once by Render and kept stable across deploys, so
      # existing sessions survive a redeploy.
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.13.9"
