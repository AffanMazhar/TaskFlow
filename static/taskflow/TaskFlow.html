<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TaskFlow — Calm. Cinematic. Yours.</title>
  <link rel="stylesheet" href="app/styles.css" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <!-- data first (plain JS, attaches to window) -->
  <script src="app/data.js"></script>

  <!-- shared components -->
  <script type="text/babel" data-presets="react" src="app/components.jsx"></script>

  <!-- tweaks panel starter -->
  <script type="text/babel" data-presets="react" src="app/tweaks-panel.jsx"></script>

  <!-- screen scripts -->
  <script type="text/babel" data-presets="react" src="app/landing.jsx"></script>
  <script type="text/babel" data-presets="react" src="app/onboarding.jsx"></script>
  <script type="text/babel" data-presets="react" src="app/auth.jsx"></script>
  <script type="text/babel" data-presets="react" src="app/dashboard.jsx"></script>
  <script type="text/babel" data-presets="react" src="app/tasks.jsx"></script>
  <script type="text/babel" data-presets="react" src="app/settings.jsx"></script>
  <script type="text/babel" data-presets="react" src="app/calendar.jsx"></script>

  <!-- root app -->
  <script type="text/babel" data-presets="react" src="app/app.jsx"></script>

  <!-- bootstrap once everything resolves -->
  <script type="text/babel" data-presets="react">
    (function boot() {
      if (!window.App) { return setTimeout(boot, 30); }
      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    })();
  </script>
</body>
</html>
