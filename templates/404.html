{% extends 'base.html' %}
{% block title %}Not found &middot; TaskFlow{% endblock %}

{% block body %}
<div class="mx-auto max-w-md py-16 text-center">
  <div class="mx-auto mb-6 flex h-16 w-16 items-center justify-center rounded-2xl bg-accent/10 text-accent">
    <svg class="h-8 w-8" fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9 9h.01M15 9h.01M9 16c1-1 2-1.5 3-1.5s2 .5 3 1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>
  <h1 class="text-3xl font-bold tracking-tight">Page not found</h1>
  <p class="mt-2 text-sm text-zinc-500 dark:text-zinc-400">The page you're looking for doesn't exist or has moved.</p>
  <a href="{{ url_for('index') }}" class="btn-accent mt-6 inline-flex rounded-lg px-4 py-2 text-sm font-semibold">
    Go home
  </a>
</div>
{% endblock %}

{% block body_public %}
<div class="text-center">
  <h1 class="text-3xl font-bold">Page not found</h1>
  <a href="{{ url_for('login') }}" class="btn-accent mt-6 inline-flex rounded-lg px-4 py-2 text-sm font-semibold">Sign in</a>
</div>
{% endblock %}
